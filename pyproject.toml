[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reach-gmaps"
version = "0.1.0"
description = "Google Maps lead scraper for businesses without websites (agent-reach architecture)"
authors = [{name = "Your Name", email = "you@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["lead-generation", "google-maps", "scraping", "playwright", "sales", "prospecting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.12",
]

[project.scripts]
gmaps-scraper = "agent_reach_gmaps.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/agent-reach-gmaps"
Repository = "https://github.com/yourusername/agent-reach-gmaps"
Issues = "https://github.com/yourusername/agent-reach-gmaps/issues"

[tool.setuptools]
packages = ["agent_reach_gmaps", "agent_reach_gmaps.scrapers", "agent_reach_gmaps.channels"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by formatter)
